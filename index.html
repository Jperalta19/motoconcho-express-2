<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092c47"><title>Motoconcho Express 2</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#061c2d;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.shell{position:relative;width:min(100vw,calc(100dvh * 420 / 740));aspect-ratio:420/740;max-height:100dvh;overflow:hidden;background:#63c4ed;box-shadow:0 0 45px #0008;touch-action:manipulation}#game,canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:1%;left:2.5%;right:2.5%;display:flex;align-items:flex-start;justify-content:space-between;gap:5px;pointer-events:none;text-shadow:0 2px 3px #000;font-weight:800;font-size:clamp(11px,3.3vw,17px)}.stats{background:#092c47ce;padding:7px 10px;border-radius:12px;line-height:1.4}.mute{pointer-events:auto;background:#092c47e8;color:white;border:2px solid #fff9;border-radius:12px;padding:8px;font-weight:bold;cursor:pointer}.powers{position:absolute;top:13%;left:3%;color:#fff;text-shadow:0 2px 3px #000;font-weight:800;font-size:clamp(11px,3vw,16px)}.notice{position:absolute;top:27%;width:100%;text-align:center;font-weight:1000;font-size:clamp(24px,8vw,40px);color:#ffe562;text-shadow:0 3px #773c08,0 5px 8px #000;pointer-events:none}.overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6%;background:linear-gradient(#08243bd0,#08243beb)}.overlay[hidden]{display:none}.overlay h1{font-size:clamp(31px,9vw,52px);line-height:.95;color:#ffe05e;text-shadow:0 4px #b6501d;margin:0 0 18px}.overlay h1 span{color:#fff}.overlay h2{font-size:clamp(27px,7vw,38px);margin:0 0 10px;color:#ffe05e}.overlay p{font-size:clamp(12px,3.7vw,17px);line-height:1.4;margin:6px 0}.action{border:0;background:#ffbe29;color:#352000;border-radius:14px;padding:12px 28px;margin:16px 0 5px;font-size:clamp(18px,5vw,23px);font-weight:1000;box-shadow:0 5px #c47512;cursor:pointer}.controls{position:absolute;bottom:2%;left:4%;right:4%;display:flex;justify-content:space-between;pointer-events:none}.controls button{pointer-events:auto;width:23%;height:48px;border:2px solid #ffffffaa;border-radius:15px;background:#092c47a8;color:#fff;font-size:26px;font-weight:900;cursor:pointer;touch-action:manipulation}.hint{font-size:12px!important;color:#bde7fc}.error{background:#8f251a;padding:12px}
</style></head><body><main class="shell" aria-label="Motoconcho Express 2"><div id="game"></div><div class="hud"><div class="stats"><div id="score">Puntos: 0</div><div id="distance">Distancia: 0 m</div><div id="level">Nivel: 1</div></div><button id="mute" class="mute" aria-label="Silenciar sonido">🔊 Sonido</button></div><div id="powers" class="powers"></div><div id="notice" class="notice" aria-live="polite"></div><div class="controls"><button id="left" aria-label="Mover a la izquierda">◀</button><button id="right" aria-label="Mover a la derecha">▶</button></div><section id="start" class="overlay"><h1>MOTOCONCHO<br><span>EXPRESS 2</span></h1><p>¡A rodar por Santo Domingo! 🇩🇴</p><p>Esquiva las huacas, recoge monedas y plátanos.</p><p>🪖 Casco: escudo · ⚡ Nitro: invulnerable<br>🧲 Imán: atrae monedas</p><button id="play" class="action">¡Arrancamos!</button><p class="hint">Usa ◀ ▶ o toca los botones de la pantalla</p></section><section id="over" class="overlay" hidden><h2>¡Se acabó el viaje!</h2><p id="final"></p><p id="record"></p><button id="again" class="action">Jugar de nuevo</button></section></main><script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script><script>
'use strict';
// Motoconcho Express 2: todos los dibujos se generan con Phaser Graphics.
const $=id=>document.getElementById(id); let muted=false,audio;
function sound(kind){if(muted)return;try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();const freqs={coin:740,banana:570,power:880,hit:120,shield:260};o.type=kind==='hit'?'sawtooth':'sine';o.frequency.setValueAtTime(freqs[kind]||440,audio.currentTime);o.frequency.exponentialRampToValueAtTime(kind==='hit'?65:(freqs[kind]||440)*1.35,audio.currentTime+.12);g.gain.setValueAtTime(.06,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.17)}catch(e){}}
$('mute').onclick=()=>{muted=!muted;$('mute').textContent=muted?'🔇 Mudo':'🔊 Sonido';$('mute').setAttribute('aria-label',muted?'Activar sonido':'Silenciar sonido')};
let best=0;try{best=Number(localStorage.getItem('motoconcho2-record'))||0}catch(e){}
if(typeof Phaser==='undefined'){$('start').insertAdjacentHTML('beforeend','<p class="error">No se pudo cargar Phaser. Comprueba tu conexión para descargar el CDN.</p>');$('play').disabled=true}else{
class Ride extends Phaser.Scene{
 constructor(){super('Ride')}
 create(){this.makeArt();this.background=this.add.graphics();this.objects=[];this.lanes=[117,210,303];this.lane=1;this.score=0;this.distance=0;this.level=1;this.speed=220;this.nextSpawn=0;this.clock=0;this.shield=false;this.nitroUntil=0;this.magnetUntil=0;this.alive=false;this.roadOffset=0;this.cloudOffset=0;this.rider=this.add.image(210,570,'rider').setDepth(5);this.rider.setVisible(false);this.keys=this.input.keyboard.createCursorKeys();this.keys.left.on('down',()=>this.move(-1));this.keys.right.on('down',()=>this.move(1));this.paint();this.refresh()}
 makeArt(){if(this.textures.exists('rider'))return;let g=this.make.graphics({x:0,y:0,add:false});
 // Un motoconchista visto desde atrás, con casco, chaqueta y moto.
 g.fillStyle(0x151c24);g.fillRoundedRect(25,38,20,46,8);g.fillRoundedRect(17,58,36,26,10);g.fillStyle(0xe8482f);g.fillRoundedRect(14,37,42,24,9);g.fillStyle(0x242d37);g.fillRect(6,42,58,5);g.fillStyle(0xe9ac73);g.fillCircle(8,45,5);g.fillCircle(62,45,5);g.fillStyle(0x186bd0);g.fillRoundedRect(20,16,30,28,8);g.fillStyle(0xf7c195);g.fillCircle(35,15,13);g.fillStyle(0xffd23f);g.fillRoundedRect(21,1,28,13,7);g.fillStyle(0xfff6d0);g.fillRect(25,4,16,3);g.fillStyle(0xfdf4b8);g.fillRect(28,66,14,7);g.generateTexture('rider',70,90);g.clear();
 g.fillStyle(0x27180e);g.fillEllipse(33,18,64,34);g.fillStyle(0x493022);g.fillEllipse(30,15,51,22);g.fillStyle(0x161514);g.fillEllipse(34,16,44,15);g.generateTexture('hole',66,36);g.clear();
 g.fillStyle(0x8f5800);g.fillCircle(17,18,16);g.fillStyle(0xffc629);g.fillCircle(17,15,15);g.lineStyle(3,0xfff098);g.strokeCircle(17,15,11);g.fillStyle(0xffe78c);g.fillRect(15,7,4,16);g.generateTexture('coin',34,34);g.clear();
 g.lineStyle(9,0xe5aa19);g.beginPath();g.arc(18,7,16,.2,2.5,false);g.strokePath();g.lineStyle(5,0xffe64b);g.beginPath();g.arc(18,5,15,.2,2.5,false);g.strokePath();g.fillStyle(0x4b391a);g.fillRect(31,6,4,5);g.generateTexture('banana',38,29);g.clear();
 g.fillStyle(0xf8c63e);g.fillCircle(18,18,18);g.fillStyle(0xf3f7ff);g.fillRoundedRect(6,10,24,13,8);g.fillStyle(0x174f91);g.fillRect(6,20,24,4);g.generateTexture('helmet',36,36);g.clear();
 g.fillStyle(0xf06627);g.fillRoundedRect(6,5,25,29,6);g.fillStyle(0xffe458);g.fillTriangle(21,6,12,21,19,20);g.fillTriangle(19,18,26,16,15,31);g.generateTexture('nitro',38,38);g.clear();
 g.fillStyle(0xe84343);g.fillRoundedRect(7,5,24,28,8);g.fillStyle(0x92dffa);g.fillRect(13,5,12,18);g.fillStyle(0xf2f6fc);g.fillRect(7,4,6,9);g.fillRect(25,4,6,9);g.generateTexture('magnet',38,38);g.destroy()}
 startRide(){this.objects.forEach(o=>o.destroy());this.objects=[];this.lane=1;this.score=0;this.distance=0;this.level=1;this.speed=220;this.clock=0;this.nextSpawn=0.7;this.shield=false;this.nitroUntil=0;this.magnetUntil=0;this.alive=true;this.rider.setPosition(210,570).setVisible(true).setAlpha(1);$('start').hidden=true;$('over').hidden=true;this.announce('¡Dale!');this.refresh()}
 move(d){if(!this.alive)return;this.lane=Phaser.Math.Clamp(this.lane+d,0,2)}
 announce(text){$('notice').textContent=text;this.noticeUntil=this.clock+1.5}
 spawn(type,lane,y=-40){const obj=this.add.image(this.lanes[lane],y,type).setDepth(4);obj.kind=type;obj.lane=lane;this.objects.push(obj);return obj}
 collect(obj){const t=obj.kind;if(t==='coin'){this.score+=10;sound('coin')}else if(t==='banana'){this.score+=15;sound('banana')}else if(t==='helmet'){this.shield=true;sound('power');this.announce('¡Casco!')}else if(t==='nitro'){this.nitroUntil=this.clock+4;sound('power');this.announce('¡Nitro!')}else if(t==='magnet'){this.magnetUntil=this.clock+7;sound('power');this.announce('¡Imán!')}obj.destroy();obj.dead=true;this.refresh()}
 hit(obj){if(this.clock<this.nitroUntil){obj.destroy();obj.dead=true;return}if(this.shield){this.shield=false;obj.destroy();obj.dead=true;sound('shield');this.announce('¡Casco salvador!');this.refresh();return}this.alive=false;sound('hit');best=Math.max(best,Math.floor(this.score));try{localStorage.setItem('motoconcho2-record',String(best))}catch(e){}$('final').textContent='Puntaje: '+Math.floor(this.score)+' · Distancia: '+Math.floor(this.distance)+' m';$('record').textContent='Récord: '+best+' puntos';$('over').hidden=false}
 refresh(){ $('score').textContent='Puntos: '+Math.floor(this.score);$('distance').textContent='Distancia: '+Math.floor(this.distance)+' m';$('level').textContent='Nivel: '+this.level;const p=[];if(this.shield)p.push('🪖 Casco');if(this.clock<this.nitroUntil)p.push('⚡ Nitro '+Math.ceil(this.nitroUntil-this.clock)+'s');if(this.clock<this.magnetUntil)p.push('🧲 Imán '+Math.ceil(this.magnetUntil-this.clock)+'s');$('powers').textContent=p.join('  ·  ')}
 paint(){const g=this.background;g.clear();g.fillStyle(0x78c9ef);g.fillRect(0,0,420,740);g.fillStyle(0xffe693);g.fillCircle(342,63,31);g.fillStyle(0xffffff,.78);for(let i=0;i<5;i++){let x=((i*120+this.cloudOffset)%540)-60;let y=36+(i%3)*26;g.fillEllipse(x,y,70,19);g.fillEllipse(x+16,y-7,38,21)}g.fillStyle(0x85b4a1);g.fillTriangle(0,210,90,120,175,210);g.fillTriangle(115,210,225,132,345,210);g.fillTriangle(265,210,350,142,420,210);g.fillStyle(0x458a6b);g.fillRect(0,188,420,552);g.fillStyle(0x659e63);g.fillRect(0,225,420,515);g.fillStyle(0x474f58);g.fillRect(65,170,290,570);g.fillStyle(0xf4e7b7);g.fillRect(68,170,5,570);g.fillRect(347,170,5,570);g.fillStyle(0xffffff,.8);for(const x of [164,256])for(let y=-70+this.roadOffset%80;y<740;y+=80)g.fillRect(x,y,4,40);g.fillStyle(0x438455);for(let y=-20+this.roadOffset%105;y<740;y+=105){g.fillCircle(34,y+20,15);g.fillCircle(386,y+55,15);g.fillStyle(0x5d4635);g.fillRect(31,y+26,6,16);g.fillRect(383,y+61,6,16);g.fillStyle(0x438455)}}
 update(time,delta){const dt=Math.min(delta/1000,.05);if(!this.alive){this.cloudOffset+=dt*5;this.paint();return}this.clock+=dt;let speed=this.speed*(this.clock<this.nitroUntil?1.55:1);this.distance+=speed*dt*.1;this.score+=speed*dt*.012;const newLevel=1+Math.floor(this.score/100);if(newLevel>this.level){this.level=newLevel;this.speed=220+(this.level-1)*25;this.announce('Nivel '+this.level)}this.roadOffset+=speed*dt;this.cloudOffset+=dt*8;this.paint();this.rider.x=Phaser.Math.Linear(this.rider.x,this.lanes[this.lane],Math.min(1,dt*15));this.rider.setAlpha(this.clock<this.nitroUntil?.65:1);this.nextSpawn-=dt;if(this.nextSpawn<=0){const r=Math.random(),type=r<.43?'hole':r<.67?'coin':r<.82?'banana':r<.88?'helmet':r<.94?'nitro':'magnet';this.spawn(type,Phaser.Math.Between(0,2));this.nextSpawn=Math.max(.48,1.15-(this.level-1)*.055)}for(const o of this.objects){if(o.dead)continue;o.y+=speed*dt;if(o.kind==='coin'&&this.clock<this.magnetUntil&&o.y>340&&o.y<620){o.x=Phaser.Math.Linear(o.x,this.rider.x,Math.min(1,dt*5))}if(Math.abs(o.y-this.rider.y)<30&&Math.abs(o.x-this.rider.x)<38){if(o.kind==='hole')this.hit(o);else this.collect(o);if(!this.alive)break}if(o.y>780){o.destroy();o.dead=true}}this.objects=this.objects.filter(o=>!o.dead);if(this.noticeUntil&&this.clock>this.noticeUntil){$('notice').textContent='';this.noticeUntil=0}this.refresh()}
}
window.game=new Phaser.Game({type:Phaser.AUTO,width:420,height:740,parent:'game',backgroundColor:'#78c9ef',scene:[Ride],scale:{mode:Phaser.Scale.FIT,autoCenter:Phaser.Scale.CENTER_BOTH},audio:{noAudio:true}});
$('play').onclick=()=>window.game.scene.getScene('Ride').startRide();$('again').onclick=()=>window.game.scene.getScene('Ride').startRide();$('left').onclick=()=>window.game.scene.getScene('Ride').move(-1);$('right').onclick=()=>window.game.scene.getScene('Ride').move(1);
}
</script></body></html>

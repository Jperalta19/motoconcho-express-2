      - name: Install authorized official Realtime client
        run: npm install --save-exact @supabase/supabase-js@2.49.1
      - name: Validate reproducible install and TypeScript build
        run: npm ci && npm run build
      - name: Save implementation and lockfile on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src supabase docs package.json package-lock.json
          git rm .github/workflows/duelo-build.yml
          git commit -m 'feat: implementar Duelo con escrow RPC y sincronización Realtime'
          git push origin HEAD:fase1-duelo

name: Validate Duelo branch
on:
  push:
    branches: [fase1-duelo]
    paths: ['.github/workflows/duelo-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Materialize reviewed phase one sources
        run: |
          node --input-type=commonjs <<'DUEL_FILES'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = {"supabase/migrations/20261119_duelo_phase1.sql":"begin;\nalter table public.progreso alter column puntos_totales type bigint;\ncreate table public.duelos (\n id uuid primary key default gen_random_uuid(), codigo text unique not null default upper(substr(encode(extensions.gen_random_bytes(8),'hex'),1,8)), apuesta bigint not null check(apuesta>=50),\n estado text not null default 'espera' check(estado in ('espera','preparando','jugando','resolviendo','terminado','cancelado')),\n creador uuid not null references public.jugadores(id), invitado uuid references public.jugadores(id),\n distancia_a numeric not null default 0, distancia_b numeric not null default 0,\n vivo_a boolean not null default true,vivo_b boolean not null default true,\n actividad_a timestamptz not null default clock_timestamp(),actividad_b timestamptz,\n muerte_a timestamptz,muerte_b timestamptz, listo_a boolean not null default false,listo_b boolean not null default false,\n inicio timestamptz, cierre timestamptz, ganador uuid references public.jugadores(id), motivo text,\n creado timestamptz not null default clock_timestamp(), check(invitado is null or invitado<>creador)\n);\ncreate table public.duelo_movimientos(id bigint generated always as identity primary key,duelo uuid not null references public.duelos(id), jugador uuid not null references public.jugadores(id), concepto text not null, puntos bigint not null, creado timestamptz not null default clock_timestamp(),unique(duelo,jugador,concepto));\ncreate table public.viajes_servidor(user_id uuid primary key references public.jugadores(id), inicio timestamptz not null, ultimo timestamptz not null, evento bigint not null default 0, puntos integer not null default 0, distancia numeric not null default 0, terminado boolean not null default false, plan jsonb not null default '[]'::jsonb, recogido integer not null default -1, run_id uuid not null default gen_random_uuid(), nivel_inicial integer not null default 1);\nalter table public.duelos enable row level security;\nalter table public.duelo_movimientos enable row level security;\nalter table public.viajes_servidor enable row level security;\nrevoke all on public.duelos,public.duelo_movimientos,public.viajes_servidor from public,anon,authenticated;\ncreate function public.duelo_usuario(token text) returns uuid language plpgsql security definer set search_path='' as $$ declare u uuid; begin select s.user_id into u from public.sesiones s where s.token_hash=encode(extensions.digest(token,'sha256'),'hex') and s.expires_at>now(); if u is null then raise exception 'Sesión inválida o vencida.'; end if; return u; end $$;\nrevoke all on function public.duelo_usuario(text) from public,anon,authenticated;\ncreate function public.duelo_liquidar(sala uuid, vencedor uuid, razon text) returns void language plpgsql security definer set search_path='' as $$ declare d public.duelos; begin\n select * into d from public.duelos where id=sala for update;\n if d.estado not in ('preparando','jugando','resolviendo') then return; end if;\n if vencedor is not null and vencedor not in (d.creador,d.invitado) then raise exception 'Ganador inválido'; end if;\n if vencedor is null then\n update public.progreso set puntos_totales=puntos_totales+d.apuesta,updated_at=now() where user_id in(d.creador,d.invitado);\n insert into public.duelo_movimientos(duelo,jugador,concepto,puntos) values(d.id,d.creador,'devolucion',d.apuesta),(d.id,d.invitado,'devolucion',d.apuesta);\n else\n update public.progreso set puntos_totales=puntos_totales+2*d.apuesta,updated_at=now() where user_id=vencedor;\n insert into public.duelo_movimientos(duelo,jugador,concepto,puntos) values(d.id,vencedor,'premio',2*d.apuesta);\n end if;\n update public.duelos set estado='terminado',ganador=vencedor,motivo=razon,cierre=clock_timestamp() where id=d.id;\n end $$;\nrevoke all on function public.duelo_liquidar(uuid,uuid,text) from public,anon,authenticated;\ncreate function public.duelo(token text, accion text, codigo text default null, apuesta bigint default null, distancia numeric default null) returns jsonb language plpgsql security definer set search_path='' as $$\ndeclare u uuid; d public.duelos; a boolean; t timestamptz:=clock_timestamp(); otra uuid; saldo bigint; delta numeric; limite numeric; primera timestamptz; resultado jsonb;\nbegin\n if accion is null then raise exception 'Operación inválida.';end if;\n u:=public.duelo_usuario(token);\n perform pg_advisory_xact_lock(193881,1);\n if accion='crear' then\n if apuesta is null or apuesta<50 then raise exception 'La apuesta mínima es 50 puntos.'; end if;\n if exists(select 1 from public.duelos where (creador=u or invitado=u) and estado in('espera','preparando','jugando','resolviendo')) then raise exception 'Ya tienes una sala activa. Recupérala o cancélala.'; end if;\n if exists(select 1 from public.viajes_servidor where user_id=u and not terminado) then raise exception 'Termina el viaje solitario antes de duelar.'; end if;\n select puntos_totales into saldo from public.progreso where user_id=u for update;\n if saldo<apuesta then raise exception 'Saldo insuficiente. Juega solitario para juntar puntos; necesitas al menos 50.'; end if;\n insert into public.duelos(creador,apuesta) values(u,apuesta) returning * into d;\n elsif accion='actual' then\n select * into d from public.duelos where (creador=u or invitado=u) and estado in('espera','preparando','jugando','resolviendo') order by creado desc limit 1 for update;\n if d.id is null then return null; end if;\n else\n select * into d from public.duelos where duelos.codigo=upper(trim(duelo.codigo)) for update;\n if d.id is null then raise exception 'Sala inexistente.'; end if;\n end if;\n a:=d.creador=u; otra:=case when a then d.invitado else d.creador end;\n if accion in('ver','unir') and d.estado='espera' and not a then\n if accion='unir' then\n if apuesta is distinct from d.apuesta then raise exception 'Debes aceptar la apuesta exacta de la sala.'; end if;\n if exists(select 1 from public.duelos where (creador=u or invitado=u) and estado in('espera','preparando','jugando','resolviendo')) or exists(select 1 from public.viajes_servidor where user_id=u and not terminado) then raise exception 'Ya tienes una partida activa.'; end if;\n perform 1 from public.progreso where user_id in(u,d.creador) order by user_id for update;\n if (select count(*) from public.progreso where user_id in(u,d.creador) and puntos_totales>=d.apuesta)<>2 then raise exception 'Saldo insuficiente para la apuesta. Juega solitario para juntar puntos.'; end if;\n update public.progreso set puntos_totales=puntos_totales-d.apuesta,updated_at=now() where user_id in(u,d.creador);\n insert into public.duelo_movimientos(duelo,jugador,concepto,puntos) values(d.id,u,'escrow',-d.apuesta),(d.id,d.creador,'escrow',-d.apuesta);\n update public.duelos set invitado=u,estado='preparando',actividad_a=t,actividad_b=t where id=d.id returning * into d;\n else\n return jsonb_build_object('codigo',d.codigo,'apuesta',d.apuesta,'estado',d.estado,'nombre_a',(select username from public.jugadores where id=d.creador));\n end if;\n elsif not coalesce(u=d.creador or u=d.invitado,false) then raise exception 'Sala llena, iniciada o acceso no autorizado.';\n elsif accion='unir' then raise exception 'Sala llena o ya iniciada.';\n end if;\n a:=d.creador=u; otra:=case when a then d.invitado else d.creador end;\n if accion='latido' and d.estado='preparando' then\n update public.duelos set actividad_a=case when a then t else actividad_a end,actividad_b=case when not a then t else actividad_b end where id=d.id;\n end if;\n if accion='cancelar' then\n if d.estado='resolviendo' then null;\n elsif d.estado='espera' then update public.duelos set estado='cancelado',cierre=t,motivo='Cancelada sin apuesta' where id=d.id;\n elsif d.estado in('preparando','jugando','resolviendo') then perform public.duelo_liquidar(d.id,otra,'Abandono'); end if;\n elsif accion='listo' and d.estado='preparando' then\n update public.duelos set listo_a=listo_a or a,listo_b=listo_b or not a,actividad_a=case when a then t else actividad_a end,actividad_b=case when not a then t else actividad_b end where id=d.id returning * into d;\n if d.listo_a and d.listo_b then update public.duelos set estado='jugando',inicio=t+interval '3 seconds',actividad_a=t+interval '3 seconds',actividad_b=t+interval '3 seconds' where id=d.id; end if;\n elsif accion in('latido','morir') and d.estado in('jugando','resolviendo') then\n if t<d.inicio then\n if accion='morir' then raise exception 'El duelo no ha comenzado.'; end if;\n else\n if distancia is null or distancia::text in('NaN','Infinity','-Infinity') or distancia<0 then raise exception 'Distancia inválida.'; end if;\n delta:=distancia-case when a then d.distancia_a else d.distancia_b end;\n -- Envelope físico conservador: velocidad base y crecimiento máximo de un objeto cada 0.34 s, nitro incluido.\n limite:=1.55*(22+2.5*floor((extract(epoch from(t-d.inicio))/0.34*15)/100));\n if delta<0 or delta>limite*greatest(0,extract(epoch from(t-case when a then d.actividad_a else d.actividad_b end)))+15 then raise exception 'Distancia fuera del límite físico.'; end if;\n if (a and d.vivo_a) or (not a and d.vivo_b) then\n update public.duelos set distancia_a=case when a then distancia else distancia_a end,distancia_b=case when not a then distancia else distancia_b end,\n actividad_a=case when a then t else actividad_a end,actividad_b=case when not a then t else actividad_b end,\n vivo_a=case when a and accion='morir' then false else vivo_a end,vivo_b=case when not a and accion='morir' then false else vivo_b end,\n muerte_a=case when a and accion='morir' then t else muerte_a end,muerte_b=case when not a and accion='morir' then t else muerte_b end,\n estado=case when accion='morir' then 'resolviendo' else estado end where id=d.id;\n end if; end if;\n elsif accion not in('crear','actual','ver','unir','listo','reclamar','latido','morir','cancelar') then raise exception 'Operación inválida.';\n end if;\n select * into d from public.duelos where id=d.id;\n if d.estado='resolviendo' then\n primera:=least(d.muerte_a,d.muerte_b);\n if not d.vivo_a and not d.vivo_b and abs(extract(epoch from(d.muerte_a-d.muerte_b)))<=2 then\n perform public.duelo_liquidar(d.id,case when d.distancia_a>d.distancia_b then d.creador when d.distancia_b>d.distancia_a then d.invitado else null end,'Choques simultáneos');\n elsif t>=primera+interval '2 seconds' then perform public.duelo_liquidar(d.id,case when d.muerte_a is null then d.creador when d.muerte_b is null then d.invitado when d.muerte_a<d.muerte_b then d.invitado else d.creador end,'Primer choque'); end if;\n elsif accion='reclamar' and d.estado in('preparando','jugando') then\n if t-(case when a then d.actividad_b else d.actividad_a end)<interval '10 seconds' then raise exception 'El rival aún no lleva 10 segundos sin señal.'; end if;\n perform public.duelo_liquidar(d.id,u,'Desconexión del rival');\n end if;\n select to_jsonb(x) into resultado from public.duelos x where x.id=d.id;\n return resultado || jsonb_build_object('yo',u,'nombre_a',(select username from public.jugadores where id=d.creador),'nombre_b',(select username from public.jugadores where id=d.invitado),'saldo',(select puntos_totales from public.progreso where user_id=u),'ahora',clock_timestamp());\nend $$;\nrevoke all on function public.duelo(text,text,text,bigint,numeric) from public;\ngrant execute on function public.duelo(text,text,text,bigint,numeric) to anon,authenticated;\n-- El endpoint antiguo ya no puede escribir saldos desde totales del navegador.\ncreate or replace function public.guardar_progreso(user_id uuid,record_m integer,puntos_totales integer,nivel integer,token text) returns jsonb language plpgsql security definer set search_path='' as $$ begin perform public.mi_perfil(user_id,token); raise exception 'Cliente antiguo: recarga el juego para guardar mediante viajes validados.'; end $$;\ncreate function public.viaje(token text,accion text,secuencia bigint default 0,evento text default null,distancia numeric default 0, viaje_id uuid default null) returns jsonb language plpgsql security definer set search_path='' as $$\ndeclare u uuid; v public.viajes_servidor; t timestamptz:=clock_timestamp(); dt numeric; valor integer; p public.progreso; idx integer; ficha bigint; mapa jsonb;\nbegin\n u:=public.duelo_usuario(token); perform pg_advisory_xact_lock(193881,1);\n if accion='descartar' then update public.viajes_servidor set terminado=true where user_id=u;return public.mi_perfil(u,token);end if;\n if accion='iniciar' then\n if exists(select 1 from public.duelos where (creador=u or invitado=u) and estado in('espera','preparando','jugando','resolviendo')) then raise exception 'Termina o cancela el duelo primero.'; end if;\n select * into p from public.progreso where user_id=u for update;\n select jsonb_agg(floor(random()*2147483647)::bigint) into mapa from generate_series(1,15001);\n insert into public.viajes_servidor(user_id,inicio,ultimo,plan,nivel_inicial) values(u,t,t,mapa,p.nivel) on conflict(user_id) do update set inicio=t,ultimo=t,evento=0,puntos=0,distancia=0,terminado=false,plan=mapa,recogido=-1,run_id=gen_random_uuid(),nivel_inicial=p.nivel;\n return jsonb_build_object('perfil',public.mi_perfil(u,token),'plan',mapa,'viaje_id',(select run_id from public.viajes_servidor where user_id=u));\n end if;\n select * into v from public.viajes_servidor where user_id=u for update;\n if viaje_id is distinct from v.run_id then raise exception 'Viaje no vigente.'; end if;\n if v.user_id is null then raise exception 'Inicia un viaje primero.'; end if;\n if v.terminado then return public.mi_perfil(u,token); end if;\n if secuencia<=v.evento then return public.mi_perfil(u,token); end if;\n if secuencia<>v.evento+1 then raise exception 'Secuencia de eventos inválida.'; end if;\n dt:=extract(epoch from(t-v.inicio));\n if dt>7200 then raise exception 'Viaje vencido.'; end if;\n select * into p from public.progreso where user_id=u for update;\n if distancia is null or distancia::text in('NaN','Infinity','-Infinity') or distancia<v.distancia or distancia>1.55*(22+2.5*(p.nivel+floor(dt/0.34*15/100)))*dt+15 then raise exception 'Distancia inválida.'; end if;\n valor:=0;\n if accion='recoger' then\n idx:=evento::integer;\n if idx<0 or idx<=v.recogido or idx>=jsonb_array_length(v.plan) or idx>floor(dt/0.48)+1 then raise exception 'Objeto inexistente, prematuro o ya consumido.'; end if;\n ficha:=(v.plan->>idx)::bigint%10000;\n valor:=case when ficha>=4400 and ficha<6800 then 10 when ficha>=6800 and ficha<8200 then 15 else 0 end;\n end if;\n if accion='recoger' then\n if valor=0 or v.puntos+valor>15*(1+floor(dt/0.34)) then raise exception 'Recogida inválida.'; end if;\n update public.progreso set puntos_totales=puntos_totales+valor,updated_at=now() where user_id=u;\n elsif accion<>'terminar' then raise exception 'Evento inválido.'; end if;\n update public.viajes_servidor set evento=secuencia,puntos=puntos+valor,distancia=viaje.distancia,ultimo=t,recogido=case when accion='recoger' then idx else recogido end,terminado=accion='terminar' where user_id=u;\n update public.progreso set record_m=greatest(record_m,floor(viaje.distancia)::integer),nivel=greatest(1,v.nivel_inicial+floor((v.puntos+valor)/100)::integer),updated_at=now() where user_id=u;\n return public.mi_perfil(u,token);\nend $$;\nrevoke all on function public.viaje(text,text,bigint,text,numeric,uuid) from public;\ngrant execute on function public.viaje(text,text,bigint,text,numeric,uuid) to anon,authenticated;\ncommit;","src/services/auth.ts":"import { rpc } from './db';\ninterface Session { user_id: string; username: string; token: string }\ninterface Profile { username: string; record_m: number; puntos_totales: number; nivel: number; is_admin: boolean }\nexport interface AdminPanel { total_jugadores: number; record_global: number; puntos_acumulados: number; top_10: { username: string; record_m: number; puntos_totales: number; nivel: number }[]; ultimos_5: { username: string; created_at: string }[] }\nlet admin = false;\nconst SESSION_KEY = 'motoconcho2-cloud-session';\nlet active: Session | null = (() => { try { const s = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); return s?.user_id && s?.username && s?.token ? s as Session : null; } catch { return null; } })();\nfunction session(): Session { if (!active) throw new Error('Debes iniciar sesión.'); return active; }\nfunction key(name: string, type: string): string { return 'motoconcho2-user-' + encodeURIComponent(name) + '-' + type; }\nfunction cache(s: Session, p: Profile): void {\n  if (active?.token !== s.token) return;\n  admin = p.is_admin === true;\n  for (const [type, value] of [['record', p.record_m], ['total', p.puntos_totales], ['level', p.nivel]] as const) {\n    try { localStorage.setItem(key(s.username, type), String(value)); } catch { /* La nube sigue siendo la fuente principal. */ }\n  }\n}\nasync function authenticate(fn: string, username: string, clave: string): Promise<string> {\n  const name = username.trim().toLowerCase();\n  if (!/^[a-z0-9_.-]{1,32}$/.test(name)) throw new Error('Usa de 1 a 32 letras sin acentos, números, punto, guion o guion bajo.');\n  if (clave.length < 6) throw new Error('La clave debe tener al menos 6 caracteres.');\n  const s = await rpc<Session>(fn, { username: name, clave });\n  const p = await rpc<Profile>('mi_perfil', { user_id: s.user_id, token: s.token });\n  active = s;\n  try { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); } catch { /* Sesión en memoria si el navegador bloquea almacenamiento. */ }\n  cache(s, p);\n  return s.username;\n}\n\nlet duelMode = false;\nlet runId: string | null = null;\nlet sequence = 0;\nlet events: Promise<void> = Promise.resolve();\nconst queue: Array<()=>Promise<void>>=[];\nfunction flush(): Promise<void> { const run=async()=>{while(queue.length){await queue[0]();queue.shift();}};events=events.catch(()=>undefined).then(run);return events; }\nfunction event(action:string,distance:number,ticket?:number):Promise<void>{\n const s=session();const n=++sequence;const id=runId;\n queue.push(async()=>{const p=await rpc<Profile>('viaje',{token:s.token,accion:action,secuencia:n,evento:ticket==null?null:String(ticket),distancia:distance,viaje_id:id});cache(s,p);});return flush();\n}\nexport const Auth = {\n setDuel(active: boolean): void {duelMode=active;},\n inDuel(): boolean {return duelMode;},\n async request<T>(fn: string,args: Record<string,unknown>): Promise<T> {return rpc<T>(fn,{...args,token:session().token});},\n async beginRide(): Promise<number[]> {\n  await flush();\n  const s=session(); const data=await rpc<{perfil:Profile;plan:number[];viaje_id:string}>('viaje',{token:s.token,accion:'iniciar'});\n  cache(s,data.perfil);runId=data.viaje_id;sequence=0;events=Promise.resolve();return data.plan;\n },\n collect(ticket: number,distance: number): void {void event('recoger',distance,ticket).catch(()=>undefined);},\n\n  getCurrentUser(): string | null { return active?.username || null; },\n  isAdmin(): boolean { return !!active && admin; },\n  async panelAdmin(): Promise<AdminPanel> { const s = session(); return rpc<AdminPanel>('panel_admin', { token: s.token }); },\n  register(username: string, password: string): Promise<string> { return authenticate('registrar', username, password); },\n  login(username: string, password: string): Promise<string> { return authenticate('iniciar_sesion', username, password); },\n  logout(): void { queue.length=0;runId=null;sequence=0;duelMode=false; active = null; admin = false; try { localStorage.removeItem(SESSION_KEY); } catch { /* memoria */ } },\n  scoreKey(type: 'total' | 'record' | 'level'): string { return key(session().username, type); },\n  async loadProfile(): Promise<void> { const s = session(); const p = await rpc<Profile>('mi_perfil', { user_id: s.user_id, token: s.token }); cache(s, p); },\n  async saveProgress(_record: number,_total: number,_level: number): Promise<void> {\n   if(duelMode)return;\n   await flush();\n   await event('terminar',_record);\n  }\n};\n","src/scenes/RideScene.ts":"import * as Phaser from 'phaser';\nimport type { GameItem, ObstacleKind, HazardKind } from '../types';\nimport { sound } from '../services/audio';\nimport { Auth } from '../services/auth';\nimport { hud } from '../ui/hud';\n\nconst HAZARDS: HazardKind[] = ['hole', 'officer', 'police_car', 'truck', 'tank'];\n\nconst HIT_HEIGHT: Record<ObstacleKind, number> = {\n  hole: 28,\n  officer: 32,\n  police_car: 42,\n  truck: 46,\n  tank: 50,\n  coin: 30,\n  gasolina: 30,\n  helmet: 30,\n  nitro: 30,\n  magnet: 30\n};\n\nconst HIT_WIDTH: Record<ObstacleKind, number> = {\n  hole: 38,\n  officer: 26,\n  police_car: 32,\n  truck: 34,\n  tank: 38,\n  coin: 30,\n  gasolina: 30,\n  helmet: 30,\n  nitro: 30,\n  magnet: 30\n};\n\nexport class RideScene extends Phaser.Scene {\n  private background!: Phaser.GameObjects.Graphics;\n  public objects: GameItem[] = [];\n  public lanes = [117, 210, 303];\n  public lane = 1;\n  public score = 0;\n  public totalScore = 0;\n  public bestDistance = 0;\n  public runStartScore = 0;\n  public distance = 0;\n  public level = 1;\n  public speed = 220;\n  public nextSpawn = 0;\n  public clock = 0;\n  public shield = false;\n  public nitroUntil = 0;\n  public magnetUntil = 0;\n  public alive = false;\n  private saving = false;\n  private plan: number[] = [];\n  private ticket = 0;\n  public roadOffset = 0;\n  public cloudOffset = 0;\n  public rider!: Phaser.GameObjects.Image;\n  private keys?: Phaser.Types.Input.Keyboard.CursorKeys;\n  private noticeUntil = 0;\n\n  constructor() {\n    super('Ride');\n  }\n\n  create(): void {\n    this.makeArt();\n    this.background = this.add.graphics();\n    this.objects = [];\n    this.lanes = [117, 210, 303];\n    this.lane = 1;\n    this.loadScores();\n    this.score = this.totalScore;\n    this.distance = 0;\n    this.level = 1;\n    this.speed = 220;\n    this.nextSpawn = 0;\n    this.clock = 0;\n    this.shield = false;\n    this.nitroUntil = 0;\n    this.magnetUntil = 0;\n    this.alive = false;\n    this.roadOffset = 0;\n    this.cloudOffset = 0;\n\n    this.rider = this.add.image(210, 570, 'rider').setDepth(5);\n    this.rider.setVisible(false);\n\n    if (this.input.keyboard) {\n      this.keys = this.input.keyboard.createCursorKeys();\n      this.keys.left.on('down', () => this.move(-1));\n      this.keys.right.on('down', () => this.move(1));\n    }\n\n    this.paint();\n    this.refresh();\n  }\n\n  public loadScores(): void {\n    try {\n      const key = Auth.scoreKey('record');\n      this.bestDistance = Number(localStorage.getItem(key)) || 0;\n    } catch {\n      this.bestDistance = 0;\n    }\n\n    try {\n      const savedScore = Number(localStorage.getItem(Auth.scoreKey('total')));\n      if (Number.isSafeInteger(savedScore) && savedScore >= 0) {\n        this.totalScore = savedScore;\n      } else {\n        this.totalScore = 0;\n      }\n    } catch {\n      this.totalScore = 0;\n    }\n  }\n\n  private makeArt(): void {\n    if (this.textures.exists('rider')) return;\n    const g = this.make.graphics({ x: 0, y: 0 });\n\n    // Motoconcho visto desde arriba: colores y silueta del juego original.\n    g.fillStyle(0x152c36, 0.44);\n    g.fillEllipse(38, 62, 48, 20);\n    g.fillStyle(0x182e3a);\n    g.fillRoundedRect(28, 15, 14, 27, 6);\n    g.fillRoundedRect(28, 60, 14, 27, 6);\n    g.fillStyle(0xff833c);\n    g.lineStyle(2, 0x173a48);\n    g.fillRoundedRect(20, 23, 30, 48, 10);\n    g.strokeRoundedRect(20, 23, 30, 48, 10);\n    g.fillStyle(0xffe15f);\n    g.fillRoundedRect(25, 53, 20, 17, 6);\n    g.strokeRoundedRect(25, 53, 20, 17, 6);\n    g.fillStyle(0xfff1a7);\n    g.fillRoundedRect(25, 15, 20, 16, 5);\n    g.strokeRoundedRect(25, 15, 20, 16, 5);\n    g.lineStyle(4, 0x173a48);\n    g.lineBetween(10, 29, 60, 29);\n    g.fillStyle(0xf2b57a);\n    g.fillCircle(13, 30, 4);\n    g.fillCircle(57, 30, 4);\n    g.fillStyle(0x18b1a3);\n    g.lineStyle(2, 0x173a48);\n    g.fillRoundedRect(17, 34, 36, 28, 12);\n    g.strokeRoundedRect(17, 34, 36, 28, 12);\n    g.fillStyle(0x173a48);\n    g.fillRoundedRect(25, 61, 20, 9, 4);\n    g.fillStyle(0xd78b54);\n    g.fillEllipse(35, 29, 26, 24);\n    g.strokeEllipse(35, 29, 26, 24);\n    g.fillStyle(0xffe25a);\n    g.fillEllipse(35, 22, 30, 24);\n    g.strokeEllipse(35, 22, 30, 24);\n    g.fillStyle(0xfff2c6);\n    g.fillRoundedRect(22, 21, 26, 6, 2);\n    g.generateTexture('rider', 70, 90);\n    g.clear();\n\n    // Huaca con borde de tierra y grietas.\n    g.fillStyle(0xcf9e5f);\n    g.fillEllipse(40, 22, 58, 32);\n    g.fillStyle(0x182d38);\n    g.fillEllipse(40, 19, 54, 28);\n    g.fillStyle(0x36444a);\n    g.fillEllipse(38, 22, 36, 16);\n    g.lineStyle(3, 0xc2a36b);\n    g.lineBetween(9, 12, 2, 7);\n    g.lineBetween(66, 28, 75, 32);\n    g.generateTexture('hole', 80, 42);\n    g.clear();\n\n    // Oficial de tránsito (DIGESETT con chaleco reflector y vara luminosa)\n    g.fillStyle(0x152c36, 0.35);\n    g.fillEllipse(28, 54, 38, 14);\n    g.fillStyle(0x13222d);\n    g.fillRoundedRect(16, 38, 10, 18, 4);\n    g.fillRoundedRect(30, 38, 10, 18, 4);\n    g.fillStyle(0x44dd00);\n    g.lineStyle(2, 0x173a48);\n    g.fillRoundedRect(12, 16, 32, 26, 6);\n    g.strokeRoundedRect(12, 16, 32, 26, 6);\n    g.fillStyle(0xffffff);\n    g.fillRect(16, 26, 24, 4);\n    g.fillRect(16, 33, 24, 3);\n    g.fillStyle(0xd58b55);\n    g.fillCircle(28, 15, 8);\n    g.fillStyle(0x1e4620);\n    g.fillCircle(28, 12, 8);\n    g.fillStyle(0x111c13);\n    g.fillRect(20, 6, 16, 4);\n    g.fillStyle(0xd58b55);\n    g.fillCircle(45, 24, 4);\n    g.fillStyle(0xff5500);\n    g.lineStyle(1, 0xffffff);\n    g.fillRoundedRect(43, 10, 6, 22, 2);\n    g.strokeRoundedRect(43, 10, 6, 22, 2);\n    g.generateTexture('officer', 56, 64);\n    g.clear();\n\n    // Carro de policía (Patrulla con sirena azul y roja)\n    g.fillStyle(0x152c36, 0.4);\n    g.fillRoundedRect(4, 8, 52, 74, 12);\n    g.fillStyle(0x111a1e);\n    g.fillRoundedRect(2, 14, 6, 16, 2);\n    g.fillRoundedRect(52, 14, 6, 16, 2);\n    g.fillRoundedRect(2, 56, 6, 16, 2);\n    g.fillRoundedRect(52, 56, 6, 16, 2);\n    g.fillStyle(0x133b68);\n    g.lineStyle(2, 0x0c213a);\n    g.fillRoundedRect(6, 6, 48, 74, 10);\n    g.strokeRoundedRect(6, 6, 48, 74, 10);\n    g.fillStyle(0xffffff);\n    g.fillRoundedRect(10, 26, 40, 32, 4);\n    g.fillStyle(0x306080);\n    g.fillRoundedRect(12, 18, 36, 10, 3);\n    g.fillRoundedRect(14, 56, 32, 8, 2);\n    g.fillStyle(0xffe66d);\n    g.fillRect(10, 7, 8, 4);\n    g.fillRect(42, 7, 8, 4);\n    g.fillStyle(0xcc2936);\n    g.fillRect(10, 76, 8, 3);\n    g.fillRect(42, 76, 8, 3);\n    g.fillStyle(0x222222);\n    g.fillRoundedRect(16, 36, 28, 8, 2);\n    g.fillStyle(0xff2222);\n    g.fillRect(17, 37, 12, 6);\n    g.fillStyle(0x2277ff);\n    g.fillRect(31, 37, 12, 6);\n    g.fillStyle(0xffffff);\n    g.fillRect(28, 37, 4, 6);\n    g.generateTexture('police_car', 60, 86);\n    g.clear();\n\n    // Camioneta (Pickup doble cabina con platón de carga)\n    g.fillStyle(0x152c36, 0.4);\n    g.fillRoundedRect(4, 10, 56, 82, 12);\n    g.fillStyle(0x111a1e);\n    g.fillRoundedRect(2, 16, 7, 18, 3);\n    g.fillRoundedRect(55, 16, 7, 18, 3);\n    g.fillRoundedRect(2, 66, 7, 18, 3);\n    g.fillRoundedRect(55, 66, 7, 18, 3);\n    g.fillStyle(0x8a2824);\n    g.lineStyle(2, 0x4a120f);\n    g.fillRoundedRect(7, 6, 50, 84, 8);\n    g.strokeRoundedRect(7, 6, 50, 84, 8);\n    g.fillStyle(0x9e312c);\n    g.fillRoundedRect(11, 8, 42, 20, 4);\n    g.fillStyle(0x2d4f5c);\n    g.fillRoundedRect(13, 26, 38, 12, 3);\n    g.fillStyle(0x731e1a);\n    g.fillRoundedRect(12, 37, 40, 18, 3);\n    g.fillStyle(0x2d4f5c);\n    g.fillRect(15, 54, 34, 4);\n    g.fillStyle(0x222224);\n    g.lineStyle(2, 0x5a1815);\n    g.fillRoundedRect(11, 60, 42, 26, 4);\n    g.strokeRoundedRect(11, 60, 42, 26, 4);\n    g.fillStyle(0x151d20);\n    g.fillCircle(32, 73, 9);\n    g.fillStyle(0x444d52);\n    g.fillCircle(32, 73, 4);\n    g.fillStyle(0xfff3a1);\n    g.fillRect(10, 6, 9, 4);\n    g.fillRect(45, 6, 9, 4);\n    g.lineStyle(3, 0x111111);\n    g.lineBetween(8, 6, 56, 6);\n    g.generateTexture('truck', 64, 96);\n    g.clear();\n\n    // Tanque de guerra (Blindado con orugas militares y cañón frontal)\n    g.fillStyle(0x152c36, 0.45);\n    g.fillRoundedRect(2, 10, 68, 88, 14);\n    g.fillStyle(0x202919);\n    g.lineStyle(1, 0x11160d);\n    g.fillRoundedRect(4, 10, 14, 84, 4);\n    g.strokeRoundedRect(4, 10, 14, 84, 4);\n    g.fillRoundedRect(54, 10, 14, 84, 4);\n    g.strokeRoundedRect(54, 10, 14, 84, 4);\n    g.fillStyle(0x39482f);\n    for (const treadY of [14, 24, 34, 44, 54, 64, 74, 84]) {\n      g.fillRect(5, treadY, 12, 3);\n      g.fillRect(55, treadY, 12, 3);\n    }\n    g.fillStyle(0x4a5d36);\n    g.lineStyle(2, 0x222e17);\n    g.fillRoundedRect(16, 12, 40, 80, 6);\n    g.strokeRoundedRect(16, 12, 40, 80, 6);\n    g.fillStyle(0x354425);\n    g.fillRoundedRect(18, 16, 18, 22, 4);\n    g.fillRoundedRect(28, 56, 24, 24, 4);\n    g.fillStyle(0x5c7244);\n    g.fillRoundedRect(26, 32, 22, 18, 4);\n    g.fillStyle(0x3c4c2c);\n    g.lineStyle(2, 0x1f2b15);\n    g.fillCircle(36, 52, 16);\n    g.strokeCircle(36, 52, 16);\n    g.fillStyle(0x29351d);\n    g.fillCircle(40, 48, 6);\n    g.fillStyle(0x2c3820);\n    g.lineStyle(2, 0x182211);\n    g.fillRoundedRect(33, 64, 6, 34, 2);\n    g.strokeRoundedRect(33, 64, 6, 34, 2);\n    g.fillRoundedRect(31, 94, 10, 6, 2);\n    g.generateTexture('tank', 72, 104);\n    g.clear();\n\n    // Moneda\n    g.fillStyle(0xb17b2e);\n    g.fillEllipse(17, 20, 24, 30);\n    g.fillStyle(0xffdb4b);\n    g.lineStyle(2, 0xba7e27);\n    g.fillEllipse(17, 17, 24, 30);\n    g.strokeEllipse(17, 17, 24, 30);\n    g.fillStyle(0xffe783);\n    g.fillEllipse(17, 17, 14, 20);\n    g.lineStyle(2, 0xa77528);\n    g.lineBetween(17, 9, 17, 25);\n    g.lineBetween(13, 12, 20, 12);\n    g.lineBetween(14, 20, 21, 20);\n    g.generateTexture('coin', 34, 36);\n    g.clear();\n\n    // Pote de gasolina rojo, con asa y etiqueta crema.\n    g.lineStyle(3, 0x173a48);\n    g.strokeRoundedRect(9, 2, 14, 9, 3);\n    g.lineStyle(2, 0xe95a3e);\n    g.strokeRoundedRect(10, 3, 12, 7, 2);\n    g.fillStyle(0x173a48);\n    g.fillRoundedRect(24, 1, 7, 6, 1);\n    g.fillStyle(0xe95a3e);\n    g.lineStyle(2, 0x173a48);\n    g.fillRoundedRect(6, 8, 26, 22, 4);\n    g.strokeRoundedRect(6, 8, 26, 22, 4);\n    g.fillStyle(0xfff1c6);\n    g.fillRoundedRect(12, 13, 14, 12, 2);\n    g.lineStyle(2, 0xba4635);\n    g.lineBetween(15, 16, 23, 22);\n    g.lineBetween(23, 16, 15, 22);\n    g.generateTexture('gasolina', 38, 32);\n    g.clear();\n\n    // Casco\n    g.fillStyle(0xf8c63e);\n    g.fillCircle(18, 18, 18);\n    g.fillStyle(0xf3f7ff);\n    g.fillRoundedRect(6, 10, 24, 13, 8);\n    g.fillStyle(0x174f91);\n    g.fillRect(6, 20, 24, 4);\n    g.generateTexture('helmet', 36, 36);\n    g.clear();\n\n    // Nitro\n    g.fillStyle(0xf06627);\n    g.fillRoundedRect(6, 5, 25, 29, 6);\n    g.fillStyle(0xffe458);\n    g.fillTriangle(21, 6, 12, 21, 19, 20);\n    g.fillTriangle(19, 18, 26, 16, 15, 31);\n    g.generateTexture('nitro', 38, 38);\n    g.clear();\n\n    // Imán\n    g.fillStyle(0xe84343);\n    g.fillRoundedRect(7, 5, 24, 28, 8);\n    g.fillStyle(0x92dffa);\n    g.fillRect(13, 5, 12, 18);\n    g.fillStyle(0xf2f6fc);\n    g.fillRect(7, 4, 6, 9);\n    g.fillRect(25, 4, 6, 9);\n    g.generateTexture('magnet', 38, 38);\n    g.destroy();\n  }\n\n  public async startRide(): Promise<void> {\n    if (!Auth.getCurrentUser() || this.saving) return;\n    this.saving=true;\n    try { if(!Auth.inDuel()) this.plan=await Auth.beginRide(); }\n    catch(error){hud.showNotice(error instanceof Error?error.message:'No se pudo iniciar el viaje.');this.saving=false;return;}\n    this.saving=false;this.ticket=0;\n    this.loadScores();\n    this.objects.forEach(o => o.destroy());\n    this.objects = [];\n    this.lane = 1;\n    this.score = this.totalScore;\n    this.level = Auth.inDuel()?1:Math.max(1, Number(localStorage.getItem(Auth.scoreKey('level'))) || 1);\n    if(Auth.inDuel()) {this.totalScore=0;this.score=0;}\n    this.runStartScore = this.totalScore - (this.level - 1) * 100;\n    this.distance = 0;\n    this.speed = 220 + (this.level - 1) * 25;\n    this.clock = 0;\n    this.nextSpawn = 0.7;\n    this.shield = false;\n    this.nitroUntil = 0;\n    this.magnetUntil = 0;\n    this.alive = true;\n\n    this.rider.setPosition(210, 570).setVisible(true).setAlpha(1);\n\n    const startEl = document.getElementById('start');\n    if (startEl) startEl.hidden = true;\n    const overEl = document.getElementById('over');\n    if (overEl) overEl.hidden = true;\n\n    this.announce('¡Dale!');\n    this.refresh();\n  }\n\n  public move(direction: number): void {\n    if (!this.alive) return;\n    this.lane = Phaser.Math.Clamp(this.lane + direction, 0, 2);\n  }\n\n  public announce(text: string): void {\n    hud.showNotice(text);\n    this.noticeUntil = this.clock + 1.5;\n  }\n\n  public spawn(type: ObstacleKind, lane: number, y = 225): GameItem {\n    y = Math.max(225, y);\n    const depth = Phaser.Math.Clamp((y - 225) / 345, 0, 1);\n    const roadX = 210 + (this.lanes[lane] - 210) * (0.5 + 0.5 * depth);\n    const obj = this.add.image(roadX, y, type) as GameItem;\n    obj.setDepth(4)\n      .setScale(0.45 + 0.55 * depth)\n      .setAlpha(Phaser.Math.Clamp((y - 225) / 55, 0, 1));\n    obj.kind = type;\n    obj.lane = lane;\n    obj.roadX = roadX;\n    this.objects.push(obj);\n    return obj;\n  }\n\n  public collect(obj: GameItem): void {\n    const t = obj.kind;\n    if (t === 'coin') {\n      this.score += 10;\n      sound.play('coin');\n    } else if (t === 'gasolina') {\n      this.score += 15;\n      sound.play('gasolina');\n    } else if (t === 'helmet') {\n      this.shield = true;\n      sound.play('power');\n      this.announce('¡Casco!');\n    } else if (t === 'nitro') {\n      this.nitroUntil = this.clock + 4;\n      sound.play('power');\n      this.announce('¡Nitro!');\n    } else if (t === 'magnet') {\n      this.magnetUntil = this.clock + 7;\n      sound.play('power');\n      this.announce('¡Imán!');\n    }\n\n    if ((t === 'coin' || t === 'gasolina') && !Auth.inDuel()) {\n      if(obj.ticket!=null) Auth.collect(obj.ticket,this.distance);\n      this.totalScore = this.score;\n      try {\n        localStorage.setItem(Auth.scoreKey('total'), String(this.totalScore));\n      } catch {\n        // ignore storage errors\n      }\n    }\n\n    obj.destroy();\n    obj.dead = true;\n    this.refresh();\n  }\n\n  public hit(obj: GameItem): void {\n    if (this.clock < this.nitroUntil) {\n      obj.destroy();\n      obj.dead = true;\n      return;\n    }\n\n    if (this.shield) {\n      this.shield = false;\n      obj.destroy();\n      obj.dead = true;\n      sound.play('shield');\n      let saveMsg = '¡Casco salvador!';\n      if (obj.kind === 'officer') saveMsg = '¡Te libraste de la multa!';\n      else if (obj.kind === 'police_car') saveMsg = '¡Esquivaste la patrulla!';\n      else if (obj.kind === 'truck') saveMsg = '¡El casco aguantó la camioneta!';\n      else if (obj.kind === 'tank') saveMsg = '¡El casco blindado resistió!';\n      this.announce(saveMsg);\n      this.refresh();\n      return;\n    }\n\n    this.alive = false;\n    sound.play('hit');\n    this.refresh();\n    if(Auth.inDuel()) {window.dispatchEvent(new Event('duelo-muerte'));return;}\n    void this.syncProgress();\n\n    const finalEl = document.getElementById('final');\n    if (finalEl) finalEl.textContent = `Puntaje: ${Math.floor(this.score)}`;\n\n    const finalDistEl = document.getElementById('final-distance');\n    if (finalDistEl) finalDistEl.textContent = `Distancia: ${Math.floor(this.distance)} m`;\n\n    const recordEl = document.getElementById('record');\n    if (recordEl) recordEl.textContent = `Récord: ${this.bestDistance} m`;\n\n    const overEl = document.getElementById('over');\n    if (overEl) overEl.hidden = false;\n  }\n\n  private async syncProgress(): Promise<void> {\n    if (this.saving) return;\n    this.saving = true;\n    const buttons = ['play', 'again', 'logout'].map(id => document.getElementById(id) as HTMLButtonElement | null);\n    buttons.forEach(b => { if (b) b.disabled = true; });\n    let status = document.getElementById('cloud-status');\n    if (!status) {\n      status = document.createElement('p'); status.id = 'cloud-status'; status.setAttribute('role', 'status');\n      document.getElementById('over')?.append(status);\n    }\n    status.textContent = 'Guardando progreso en la nube...';\n    document.getElementById('cloud-retry')?.remove();\n    try {\n      await Auth.saveProgress(this.distance, this.totalScore, this.level);\n      await Auth.loadProfile();this.loadScores();this.score=this.totalScore;this.refresh();\n      status.textContent = 'Progreso guardado en la nube.';\n    } catch (error) {\n      status.textContent = (error instanceof Error ? error.message : 'Error de conexión.') + ' Esta partida aún no está en la nube. Reintenta antes de cerrar o salir.';\n      const retry = document.createElement('button'); retry.id = 'cloud-retry'; retry.textContent = 'Reintentar guardado';\n      retry.onclick = () => { void this.syncProgress(); }; status.after(retry);\n    } finally {\n      this.saving = false; buttons.forEach(b => { if (b) b.disabled = false; });\n    }\n  }\n\n  public refresh(): void {\n    const travelled = Math.floor(this.distance);\n    if (!Auth.inDuel() && travelled > this.bestDistance) {\n      this.bestDistance = travelled;\n      try {\n        localStorage.setItem(Auth.scoreKey('record'), String(this.bestDistance));\n      } catch {\n        // ignore storage errors\n      }\n    }\n\n    hud.updateStats({\n      score: this.score,\n      distance: this.distance,\n      bestDistance: this.bestDistance,\n      level: this.level,\n      shield: this.shield,\n      nitroRemaining: Math.max(0, this.nitroUntil - this.clock),\n      magnetRemaining: Math.max(0, this.magnetUntil - this.clock)\n    });\n  }\n\n  public paint(): void {\n    const g = this.background;\n    g.clear();\n\n    // Cielo\n    g.fillStyle(0x78d9cf);\n    g.fillRect(0, 0, 420, 740);\n\n    // Sol\n    g.fillStyle(0xffe784);\n    g.fillCircle(353, 141, 31);\n\n    // Edificios del fondo\n    const colors = [0xed825b, 0xf4ca77, 0x6cb6ac, 0xb4a2ce];\n    for (let k = 0; k < 7; k++) {\n      const x = k * 63 - 8;\n      const y = 148 + (k % 3) * 10;\n      g.fillStyle(colors[k % 4]);\n      g.lineStyle(2, 0x4c7472);\n      g.fillRoundedRect(x, y, 55, 89, 4);\n      g.strokeRoundedRect(x, y, 55, 89, 4);\n      g.fillStyle(0xfff0c4);\n      for (let j = 0; j < 2; j++) {\n        for (let a = 0; a < 2; a++) {\n          g.fillRect(x + 8 + j * 23, y + 9 + a * 14, 7, 7);\n        }\n      }\n    }\n\n    // Suelo verde y acera\n    g.fillStyle(0x9ebc73);\n    g.fillRect(0, 215, 420, 525);\n    g.fillStyle(0xd8b371);\n    g.fillRect(27, 215, 366, 525);\n\n    // Asfalto\n    g.fillStyle(0x344950);\n    g.fillRect(38, 215, 344, 525);\n\n    // Bordillos amarillos\n    g.fillStyle(0xf6de96);\n    g.fillRect(41, 215, 3, 525);\n    g.fillRect(376, 215, 3, 525);\n\n    // Líneas divisorias de carriles con desplazamiento\n    g.fillStyle(0xf1e5bf);\n    for (const x of [154, 266]) {\n      for (let y = 215 + (this.roadOffset % 82) - 82; y < 740; y += 82) {\n        if (y + 41 > 215) {\n          g.fillRect(x, Math.max(215, y), 3, Math.min(y + 41, 740) - Math.max(215, y));\n        }\n      }\n    }\n\n    // Palmitas estilizadas en los extremos\n    for (const [x, y] of [\n      [15, 215],\n      [407, 348]\n    ]) {\n      g.lineStyle(7, 0x855b3d);\n      g.lineBetween(x, y + 49, x + 4, y);\n      g.lineStyle(6, 0x1b866c);\n      g.lineBetween(x + 4, y, x - 20, y - 12);\n      g.lineBetween(x + 4, y, x - 12, y - 22);\n      g.lineBetween(x + 4, y, x + 7, y - 24);\n      g.lineBetween(x + 4, y, x + 25, y - 16);\n      g.lineBetween(x + 4, y, x + 27, y + 4);\n    }\n  }\n\n  override update(_time: number, delta: number): void {\n    const dt = Math.min(delta / 1000, 0.05);\n\n    if (!this.alive) {\n      this.cloudOffset += dt * 5;\n      this.paint();\n      return;\n    }\n\n    this.clock += dt;\n    const speed = this.speed * (this.clock < this.nitroUntil ? 1.55 : 1);\n    this.distance += speed * dt * 0.1;\n\n    const newLevel = 1 + Math.floor((this.score - this.runStartScore) / 100);\n    if (newLevel > this.level) {\n      this.level = newLevel;\n      this.speed = 220 + (this.level - 1) * 25;\n      let msg = `Nivel ${this.level}`;\n      if (this.level === 2) msg = '¡Nivel 2: ¡Los Amet!';\n      else if (this.level === 3) msg = '¡Nivel 3: ¡La Policía!';\n      else if (this.level === 4) msg = '¡Nivel 4: ¡Camionetas!';\n      else if (this.level === 5) msg = '¡Nivel 5: ¡Tanques de guerra!';\n      else if (this.level >= 6) msg = `¡Nivel ${this.level}: ¡Tapón total!`;\n      this.announce(msg);\n    }\n\n    this.roadOffset += speed * dt;\n    this.cloudOffset += dt * 8;\n    this.paint();\n\n    this.rider.x = Phaser.Math.Linear(this.rider.x, this.lanes[this.lane], Math.min(1, dt * 15));\n    this.rider.setAlpha(this.clock < this.nitroUntil ? 0.65 : 1);\n\n    this.nextSpawn -= dt;\n    if (this.nextSpawn <= 0) {\n      const ticket = this.ticket++;\n      const value = this.plan[ticket];\n      const r = Auth.inDuel()?Math.random():(value % 10000)/10000;\n      const type: ObstacleKind =\n        r < 0.44\n          ? this.getHazardForLevel(this.level)\n          : r < 0.68\n          ? 'coin'\n          : r < 0.82\n          ? 'gasolina'\n          : r < 0.88\n          ? 'helmet'\n          : r < 0.94\n          ? 'nitro'\n          : 'magnet';\n      const obj=this.spawn(type,Auth.inDuel()?Phaser.Math.Between(0,2):Math.floor(value/10000)%3);\n      obj.ticket=ticket;\n      this.nextSpawn = Math.max(0.48, 1.15 - (this.level - 1) * 0.055);\n    }\n\n    for (const o of this.objects) {\n      if (o.dead) continue;\n      o.y += speed * dt;\n      const depth = Phaser.Math.Clamp((o.y - 225) / 345, 0, 1);\n      const roadX = 210 + (this.lanes[o.lane] - 210) * (0.5 + 0.5 * depth);\n      o.x += roadX - o.roadX;\n      o.roadX = roadX;\n      o.setScale(0.45 + 0.55 * depth).setAlpha(Phaser.Math.Clamp((o.y - 225) / 55, 0, 1));\n\n      if (o.kind === 'coin' && this.clock < this.magnetUntil && o.y > 340 && o.y < 620) {\n        o.x = Phaser.Math.Linear(o.x, this.rider.x, Math.min(1, dt * 5));\n      }\n\n      const isHazard = HAZARDS.includes(o.kind as HazardKind);\n      const hitY = HIT_HEIGHT[o.kind] || 30;\n      const hitX = HIT_WIDTH[o.kind] || 35;\n\n      if (Math.abs(o.y - this.rider.y) < hitY && Math.abs(o.x - this.rider.x) < hitX) {\n        if (isHazard) {\n          this.hit(o);\n        } else {\n          this.collect(o);\n        }\n        if (!this.alive) break;\n      }\n\n      if (o.y > 780) {\n        o.destroy();\n        o.dead = true;\n      }\n    }\n\n    this.objects = this.objects.filter(o => !o.dead);\n\n    if (this.noticeUntil && this.clock > this.noticeUntil) {\n      hud.clearNotice();\n      this.noticeUntil = 0;\n    }\n\n    this.refresh();\n  }\n\n  private getHazardForLevel(level: number): ObstacleKind {\n    const r = Math.random();\n    if (level === 1) {\n      // Nivel 1: Solo hoyos (huacas)\n      return 'hole';\n    } else if (level === 2) {\n      // Nivel 2: Oficiales del tránsito (DIGESETT/Amet) con algunos hoyos\n      return r < 0.75 ? 'officer' : 'hole';\n    } else if (level === 3) {\n      // Nivel 3: Carros de policías\n      if (r < 0.60) return 'police_car';\n      if (r < 0.85) return 'officer';\n      return 'hole';\n    } else if (level === 4) {\n      // Nivel 4: Camionetas\n      if (r < 0.50) return 'truck';\n      if (r < 0.75) return 'police_car';\n      if (r < 0.90) return 'officer';\n      return 'hole';\n    } else if (level === 5) {\n      // Nivel 5: Tanques de guerra\n      if (r < 0.45) return 'tank';\n      if (r < 0.65) return 'truck';\n      if (r < 0.82) return 'police_car';\n      return r < 0.92 ? 'officer' : 'hole';\n    } else {\n      // Nivel 6+: ¡Combinación caótica total de todos los obstáculos!\n      const allHazards: ObstacleKind[] = ['hole', 'officer', 'police_car', 'truck', 'tank'];\n      return allHazards[Math.floor(Math.random() * allHazards.length)];\n    }\n  }\n}","src/types/index.ts":"import * as Phaser from 'phaser';\n\nexport type HazardKind = 'hole' | 'officer' | 'police_car' | 'truck' | 'tank';\nexport type PickupKind = 'coin' | 'gasolina' | 'helmet' | 'nitro' | 'magnet';\nexport type ObstacleKind = HazardKind | PickupKind;\n\nexport interface GameItem extends Phaser.GameObjects.Image {\n  ticket?: number;\n  kind: ObstacleKind;\n  lane: number;\n  roadX: number;\n  dead?: boolean;\n}\n\nexport type SoundKind = 'coin' | 'gasolina' | 'power' | 'hit' | 'shield';\n\nexport interface UserAccount {\n  username: string;\n  passwordHash: string;\n  createdAt: string;\n}","src/services/duelo.ts":"import { createClient, type RealtimeChannel } from '@supabase/supabase-js';\nimport { SUPABASE_URL, SUPABASE_ANON_KEY } from './db';\nimport { Auth } from './auth';\nimport type { RideScene } from '../scenes/RideScene';\ninterface Room {id:string;codigo:string;apuesta:number;estado:string;creador:string;invitado:string|null;yo:string;nombre_a:string;nombre_b:string|null;distancia_a:number;distancia_b:number;vivo_a:boolean;vivo_b:boolean;ganador:string|null;motivo:string|null;inicio:string|null;ahora:string;saldo:number;actividad_a:string;actividad_b:string;}\nexport function initDuelo(getScene:()=>RideScene|null):void {\n const start=document.getElementById('start')!;\n const button=document.createElement('button');button.className='action secondary';button.textContent='Duelo · 2 jugadores';start.querySelector('.card')!.append(button);\n const panel=document.createElement('section');panel.className='overlay';panel.id='duelo';panel.hidden=true;panel.setAttribute('aria-label','Modo Duelo');\n panel.innerHTML='<div class=\"card\" style=\"max-height:90%;overflow:auto\"><div class=\"eyebrow\">DOS PISTAS · UN GANADOR</div><h2>Duelo</h2><p id=\"duelo-info\" role=\"status\"></p><div id=\"duelo-options\"><label for=\"duelo-bet\">Apuesta en puntos (mínimo 50)</label><input id=\"duelo-bet\" type=\"number\" min=\"50\" step=\"1\" value=\"50\"><button id=\"duelo-create\" class=\"action\">Crear sala</button><label for=\"duelo-code\">Código de sala</label><input id=\"duelo-code\" maxlength=\"8\" autocapitalize=\"characters\" autocomplete=\"off\"><button id=\"duelo-preview\" class=\"action secondary\">Buscar sala</button></div><button id=\"duelo-accept\" class=\"action\" hidden>Aceptar apuesta y unirme</button><button id=\"duelo-ready\" class=\"action\" hidden>¡Estoy listo!</button><button id=\"duelo-claim\" class=\"action secondary\" hidden>Reclamar victoria por abandono</button><button id=\"duelo-leave\" class=\"action secondary\">Volver</button><p class=\"mini\">El primero que choca pierde. Choques dentro de 2 s: gana la mayor distancia; igualdad exacta devuelve las apuestas. Tras 10 s sin señal del rival puedes reclamar el pozo. Salir de un duelo iniciado entrega el pozo al rival.</p><p id=\"duelo-error\" role=\"alert\"></p></div>';\n document.querySelector('.shell')!.append(panel);\n const manage=document.createElement('button');manage.textContent='Sala Duelo';manage.hidden=true;manage.style.cssText='position:absolute;top:230px;right:12px;z-index:12;font-size:12px';manage.onclick=()=>{panel.hidden=false;};document.querySelector('.shell')!.append(manage);\n const live=document.createElement('div');live.id='duelo-live';live.hidden=true;live.style.cssText='position:absolute;top:175px;left:5%;width:90%;z-index:8;background:#103b49;color:#fff1c6;padding:8px;border-radius:12px;font-size:13px;pointer-events:none';document.querySelector('.shell')!.append(live);\n const el=<T extends HTMLElement=HTMLElement>(id:string)=>document.getElementById(id) as T;\n const info=el('duelo-info'),error=el('duelo-error'),options=el('duelo-options');\n let room:Room|null=null,preview:Room|null=null,busy=false,started=false,recovered=false,dead=false,stopped=false,clockOffset=0,lastSignal=0;\n let channel:RealtimeChannel|null=null,topic='';\n const realtime=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});\n function controls(disabled:boolean):void {['play','again','logout'].forEach(id=>{const b=el<HTMLButtonElement>(id);if(b)b.disabled=disabled;});}\n async function call(action:string,extra:Record<string,unknown>={}):Promise<Room|null>{return Auth.request<Room|null>('duelo',{accion:action,codigo:room?.codigo,...extra});}\n async function safe(fn:()=>Promise<void>):Promise<void>{if(busy)return;busy=true;error.textContent='';try{await fn();}catch(e){error.textContent=e instanceof Error?e.message:'No se pudo conectar.';}finally{busy=false;}}\n function isA(r:Room):boolean{return r.creador===r.yo;}\n function freeze():void {const s=getScene();if(s)s.alive=false;stopped=true;}\n async function connect(r:Room):Promise<void>{\n if(topic===r.id)return;if(channel)await realtime.removeChannel(channel);topic=r.id;\n channel=realtime.channel('duelo:'+r.id,{config:{broadcast:{self:false},presence:{key:r.yo}}});\n channel.on('broadcast',{event:'actualiza'},()=>{lastSignal=0;});\n channel.on('presence',{event:'sync'},()=>{live.dataset.presencia=String(Object.keys(channel!.presenceState()).length);});\n channel.subscribe(status=>{if(status==='SUBSCRIBED')void channel?.track({nombre:Auth.getCurrentUser()});});\n }\n function draw(r:Room):void {\n room=r;clockOffset=Date.parse(r.ahora)-Date.now();const a=isA(r);const mine=Number(a?r.distancia_a:r.distancia_b),other=Number(a?r.distancia_b:r.distancia_a),opponent=(a?r.nombre_b:r.nombre_a)||'Esperando rival';\n const active=['espera','preparando','jugando','resolviendo'].includes(r.estado);controls(active);manage.hidden=!active;\n options.hidden=!!r.id;el('duelo-accept').hidden=true;el('duelo-ready').hidden=r.estado!=='preparando';\n const rivalLast=Date.parse(a?r.actividad_b:r.actividad_a);const canClaim=['preparando','jugando'].includes(r.estado)&&Date.now()+clockOffset-rivalLast>=10000;\n if(canClaim){panel.hidden=false;info.textContent='El rival lleva al menos 10 segundos sin señal. Puedes reclamar la victoria.';}\n el('duelo-claim').hidden=!canClaim;\n el('duelo-leave').textContent=active?(r.estado==='espera'?'Cancelar sala':'Abandonar (pierdes la apuesta)'):'Volver al menú';\n if(r.estado==='espera'){info.textContent='Sala '+r.codigo+' · Duelo a '+r.apuesta+' puntos. Comparte el código. Los puntos se congelan cuando el rival acepta.';}\n if(r.estado==='preparando'){info.textContent='Duelo a '+r.apuesta+' puntos contra '+opponent+'. Pozo: '+(2*r.apuesta)+' puntos. Ambos deben pulsar ¡Estoy listo!';}\n if(r.estado==='jugando'){\n const delay=Math.max(0,Date.parse(r.inicio!)-(Date.now()+clockOffset));\n if(!started&&!recovered&&delay<1){started=true;Auth.setDuel(true);void getScene()?.startRide();panel.hidden=true;live.hidden=false;}\n if(!started){info.textContent=recovered?'Duelo recuperado. No se reinicia la pista: abandona o reclama si el rival está desconectado.':'¡Arrancamos en '+Math.ceil(delay/1000)+'!';}\n }\n if(r.estado==='resolviendo'){freeze();live.hidden=false;live.textContent='¡Choque! Verificando ventana de 2 segundos…';}\n else if(['jugando','preparando'].includes(r.estado)){\n live.textContent='Tú: '+Math.floor(getScene()?.distance||mine)+' m · '+opponent+': '+Math.floor(other)+' m · '+((a?r.vivo_b:r.vivo_a)?'Vivo':'Muerto')+' · Pozo '+2*r.apuesta;\n }\n if(!active){freeze();live.hidden=true;panel.hidden=false;el('duelo-ready').hidden=true;el('duelo-claim').hidden=true;\n const verdict=r.estado==='cancelado'?'Sala cancelada sin cobrar apuestas':r.ganador===null?'Empate: apuesta devuelta':r.ganador===r.yo?'¡Ganaste el pozo!':'Ganó '+opponent;\n info.textContent=verdict+' · Tú: '+mine.toFixed(2)+' m · '+opponent+': '+other.toFixed(2)+' m · Pozo: '+2*r.apuesta+' puntos · Saldo: '+r.saldo+' · '+(r.motivo||'');\n Auth.setDuel(false);void Auth.loadProfile().catch(()=>undefined);\n }\n }\n async function accept(r:Room|null):Promise<void>{if(!r)return;draw(r);await connect(r);}\n button.onclick=()=>void safe(async()=>{\n if(getScene()?.alive)throw new Error('Termina el viaje primero.');await Auth.request('viaje',{accion:'descartar'});await Auth.loadProfile();panel.hidden=false;start.hidden=true;el('over').hidden=true;room=null;preview=null;started=false;dead=false;stopped=false;recovered=false;options.hidden=false;live.hidden=true;el<HTMLButtonElement>('duelo-ready').disabled=false;el('duelo-accept').hidden=true;el('duelo-ready').hidden=true;el('duelo-claim').hidden=true;\n const current=await call('actual');if(current){recovered=['jugando','resolviendo'].includes(current.estado);await accept(current);return;}\n const balance=Number(localStorage.getItem(Auth.scoreKey('total')));info.textContent=balance<50?'Necesitas al menos 50 puntos. Juega solitario para juntar puntos.':'Saldo: '+balance+' puntos. Crea una sala o busca un código.';\n el<HTMLButtonElement>('duelo-create').disabled=balance<50;el<HTMLButtonElement>('duelo-preview').disabled=balance<50;\n });\n el('duelo-create').onclick=()=>void safe(async()=>{const bet=Number(el<HTMLInputElement>('duelo-bet').value);if(!Number.isSafeInteger(bet)||bet<50)throw new Error('La apuesta mínima es 50 puntos enteros.');await accept(await call('crear',{apuesta:bet}));});\n el('duelo-preview').onclick=()=>void safe(async()=>{preview=await call('ver',{codigo:el<HTMLInputElement>('duelo-code').value.trim().toUpperCase()});if(!preview)return;info.textContent='Duelo a '+preview.apuesta+' puntos contra '+preview.nombre_a+'. Aceptar congela tu apuesta y la del creador.';el('duelo-accept').hidden=false;});\n el('duelo-accept').onclick=()=>void safe(async()=>{if(!preview)return;await accept(await call('unir',{codigo:preview.codigo,apuesta:preview.apuesta}));preview=null;});\n el('duelo-ready').onclick=()=>void safe(async()=>{await accept(await call('listo'));el<HTMLButtonElement>('duelo-ready').disabled=true;});\n el('duelo-claim').onclick=()=>void safe(async()=>{await accept(await call('reclamar'));});\n el('duelo-leave').onclick=()=>void safe(async()=>{\n if(room&&['espera','preparando','jugando','resolviendo'].includes(room.estado)){await accept(await call('cancelar'));return;}\n freeze();Auth.setDuel(false);room=null;preview=null;panel.hidden=true;live.hidden=true;start.hidden=false;controls(false);el<HTMLButtonElement>('duelo-ready').disabled=false;\n if(channel)await realtime.removeChannel(channel);channel=null;topic='';await Auth.loadProfile();getScene()?.loadScores();\n });\n window.addEventListener('duelo-muerte',()=>{dead=true;lastSignal=0;});\n window.setInterval(()=>{\n if(!room||busy||!['espera','preparando','jugando','resolviendo'].includes(room.estado))return;\n const now=Date.now();if(now-lastSignal<500)return;lastSignal=now;\n void safe(async()=>{\n const action=dead?'morir':recovered?'ver':room!.estado==='espera'?'ver':'latido';\n const r=await call(action,{distancia:getScene()?.distance||0});if(r){draw(r);if(dead&&r.estado!=='jugando')dead=false;}\n if(channel)void channel.send({type:'broadcast',event:'actualiza',payload:{}});\n });\n },250);\n window.addEventListener('beforeunload',()=>{if(room&&started&&!stopped)freeze();});\n}\n","src/main.ts":"import './styles/main.css';\nimport * as Phaser from 'phaser';\nimport { RideScene } from './scenes/RideScene';\nimport { sound } from './services/audio';\nimport { Auth } from './services/auth';\nimport { updateAdmin } from './ui/admin';\nimport { hud } from './ui/hud';\n\n// Helper selector\nconst $ = <T extends HTMLElement = HTMLElement>(id: string): T | null =>\n  document.getElementById(id) as T | null;\n\n// Phaser Game configuration\nconst config: Phaser.Types.Core.GameConfig = {\n  type: Phaser.AUTO,\n  width: 420,\n  height: 740,\n  parent: 'game',\n  backgroundColor: '#78d9cf',\n  scene: [RideScene],\n  scale: {\n    mode: Phaser.Scale.FIT,\n    autoCenter: Phaser.Scale.CENTER_BOTH\n  },\n  audio: {\n    noAudio: true\n  }\n};\n\nconst game = new Phaser.Game(config);\n\nfunction getRideScene(): RideScene | null {\n  return game.scene.getScene('Ride') as RideScene | null;\n}\n\n// Sound button setup\nconst muteBtn = $<HTMLButtonElement>('mute');\nif (muteBtn) {\n  muteBtn.onclick = () => {\n    const isMuted = sound.toggleMute();\n    hud.updateMuteButton(isMuted);\n  };\n}\n\n// Game controls\nconst playBtn = $<HTMLButtonElement>('play');\nif (playBtn) {\n  playBtn.onclick = () => getRideScene()?.startRide();\n}\n\nconst againBtn = $<HTMLButtonElement>('again');\nif (againBtn) {\n  againBtn.onclick = () => getRideScene()?.startRide();\n}\n\nconst leftBtn = $<HTMLButtonElement>('left');\nif (leftBtn) {\n  leftBtn.onclick = () => getRideScene()?.move(-1);\n}\n\nconst rightBtn = $<HTMLButtonElement>('right');\nif (rightBtn) {\n  rightBtn.onclick = () => getRideScene()?.move(1);\n}\n\n// Authentication & Session Manager\nconst authOverlay = $('auth');\nconst authError = $('auth-error');\nconst authUser = $<HTMLInputElement>('auth-user');\nconst authPassword = $<HTMLInputElement>('auth-password');\nconst registerBtn = $<HTMLButtonElement>('register');\nconst loginBtn = $<HTMLButtonElement>('login');\nconst logoutBtn = $<HTMLButtonElement>('logout');\n\nfunction readNumber(key: string): number {\n  try {\n    const n = Number(localStorage.getItem(key));\n    return Number.isSafeInteger(n) && n >= 0 ? n : 0;\n  } catch {\n    return 0;\n  }\n}\n\nfunction displaySession(): void {\n  updateAdmin();\n  const currentUser = Auth.getCurrentUser();\n  if (currentUser) {\n    const best = readNumber(Auth.scoreKey('record'));\n    const totalScore = readNumber(Auth.scoreKey('total'));\n\n    const scene = getRideScene();\n    if (scene && scene.rider) {\n      scene.score = totalScore;\n      scene.totalScore = totalScore;\n      scene.bestDistance = best;\n      scene.distance = 0;\n      scene.level = Math.max(1, readNumber(Auth.scoreKey('level')));\n      scene.refresh();\n    }\n\n    const scoreEl = $('score');\n    if (scoreEl) scoreEl.textContent = totalScore.toString();\n\n    const bestEl = $('best-distance');\n    if (bestEl) bestEl.textContent = `${best} m`;\n\n    if (authOverlay) authOverlay.hidden = true;\n    if (logoutBtn) logoutBtn.hidden = false;\n  } else {\n    if (authOverlay) authOverlay.hidden = false;\n    if (logoutBtn) logoutBtn.hidden = true;\n  }\n}\n\nasync function handleAuth(method: 'login' | 'register'): Promise<void> {\n  if (!authError || !registerBtn || !loginBtn || !authUser || !authPassword) return;\n\n  authError.textContent = 'Cargando...';\n  registerBtn.disabled = true;\n  loginBtn.disabled = true;\n\n  try {\n    await Auth[method](authUser.value, authPassword.value);\n    authPassword.value = '';\n    authError.textContent = '';\n    displaySession();\n  } catch (err: unknown) {\n    if (err instanceof Error) {\n      authError.textContent = err.message || 'No se pudo guardar la sesión en este navegador.';\n    } else {\n      authError.textContent = 'Error al autenticar usuario.';\n    }\n  } finally {\n    registerBtn.disabled = false;\n    loginBtn.disabled = false;\n  }\n}\n\nif (registerBtn) {\n  registerBtn.onclick = () => void handleAuth('register');\n}\n\nif (loginBtn) {\n  loginBtn.onclick = () => void handleAuth('login');\n}\n\nif (authPassword) {\n  authPassword.addEventListener('keydown', (e: KeyboardEvent) => {\n    if (e.key === 'Enter') {\n      void handleAuth('login');\n    }\n  });\n}\n\nif (logoutBtn) {\n  logoutBtn.onclick = () => {\n    const scene = getRideScene();\n    if (scene && scene.rider) {\n      scene.alive = false;\n      scene.rider.setVisible(false);\n      scene.objects.forEach(o => o.destroy());\n      scene.objects = [];\n      scene.score = 0;\n      scene.totalScore = 0;\n      scene.bestDistance = 0;\n      scene.distance = 0;\n      scene.level = 1;\n    }\n\n    Auth.logout();\n\n    const scoreEl = $('score');\n    if (scoreEl) scoreEl.textContent = '0';\n\n    const distEl = $('distance');\n    if (distEl) distEl.textContent = '0 m';\n\n    const bestEl = $('best-distance');\n    if (bestEl) bestEl.textContent = '0 m';\n\n    const levelEl = $('level');\n    if (levelEl) levelEl.textContent = '1';\n\n    const powersEl = $('powers');\n    if (powersEl) powersEl.textContent = '';\n\n    const noticeEl = $('notice');\n    if (noticeEl) noticeEl.textContent = '';\n\n    const overEl = $('over');\n    if (overEl) overEl.hidden = true;\n\n    const startEl = $('start');\n    if (startEl) startEl.hidden = false;\n\n    if (authError) authError.textContent = '';\n    if (authPassword) authPassword.value = '';\n\n    displaySession();\n    authUser?.focus();\n  };\n}\n\n// Initial session check once DOM and Scene are ready\nwindow.addEventListener('load', () => {\n  void (async () => {\n    if (Auth.getCurrentUser()) {\n      if (authError) authError.textContent = 'Cargando progreso de la nube...';\n      try { await Auth.loadProfile(); }\n      catch (error) {\n        Auth.logout();\n        displaySession();\n        if (authError) authError.textContent = error instanceof Error ? error.message : 'No se pudo cargar el perfil.';\n        return;\n      }\n    }\n    if (authError) authError.textContent = '';\n    displaySession();\n  })();\n});\n\n// Also expose game scene getter on window for dev debugging if needed\n(window as unknown as { game: Phaser.Game }).game = game;\nimport { initDuelo } from './services/duelo';\ninitDuelo(getRideScene);\n","supabase/tests/duelo_phase1.sql":"begin;\ncreate temporary table pruebas(nombre text,resultado text) on commit drop;\ndo $$ declare a uuid;b uuid;ta text:=encode(extensions.gen_random_bytes(32),'hex');tb text:=encode(extensions.gen_random_bytes(32),'hex');r jsonb;c text;fail boolean; begin\n select id into a from public.jugadores where username='boba_test'; select id into b from public.jugadores where username='jperaltar';\n if a is null or b is null then raise exception 'Faltan cuentas para pruebas reversibles';end if;\n delete from public.sesiones where user_id in(a,b);insert into public.sesiones(user_id,token_hash) values(a,encode(extensions.digest(ta,'sha256'),'hex')),(b,encode(extensions.digest(tb,'sha256'),'hex'));\n update public.progreso set puntos_totales=1000 where user_id in(a,b);\n begin perform public.duelo('invalido','crear',null,50);raise exception 'ACEPTADO';exception when others then if SQLERRM not like 'Sesión inválida%' then raise;end if;insert into pruebas values('token inválido',SQLERRM);end;\n begin perform public.duelo(ta,'crear',null,49);raise exception 'ACEPTADO';exception when others then if SQLERRM not like 'La apuesta mínima%' then raise;end if;insert into pruebas values('apuesta 49',SQLERRM);end;\n begin perform public.duelo(ta,'unir','NOEXISTE',50);raise exception 'ACEPTADO';exception when others then if SQLERRM<>'Sala inexistente.' then raise;end if;insert into pruebas values('sala inexistente',SQLERRM);end;\n begin perform public.duelo(ta,'crear',null,1001);raise exception 'ACEPTADO';exception when others then if SQLERRM not like 'Saldo insuficiente%' then raise;end if;insert into pruebas values('saldo insuficiente',SQLERRM);end;\n r:=public.duelo(ta,'crear',null,50);c:=r->>'codigo';insert into pruebas values('crear',r->>'estado');\n r:=public.duelo(tb,'unir',c,50);insert into pruebas values('escrow',(select string_agg(puntos_totales::text,',') from public.progreso where user_id in(a,b)));\n begin perform public.duelo(ta,'unir',c,50);raise exception 'ACEPTADO';exception when others then if SQLERRM<>'Sala llena o ya iniciada.' then raise;end if;insert into pruebas values('sala llena',SQLERRM);end;\n r:=public.duelo(ta,'listo',c);r:=public.duelo(tb,'listo',c);insert into pruebas values('inicio',r->>'estado');\n begin perform public.duelo(tb,'unir',c,50);raise exception 'ACEPTADO';exception when others then if SQLERRM<>'Sala llena o ya iniciada.' then raise;end if;insert into pruebas values('sala iniciada',SQLERRM);end;\n r:=public.duelo(ta,'cancelar',c);r:=public.duelo(ta,'cancelar',c);insert into pruebas values('premio una sola vez',(select string_agg(puntos_totales::text,',') from public.progreso where user_id in(a,b)));\n begin perform public.guardar_progreso(a,0,999999,1,ta);raise exception 'ACEPTADO';exception when others then if SQLERRM not like 'Cliente antiguo%' then raise;end if;insert into pruebas values('total cliente rechazado',SQLERRM);end;\n\n -- Round-trip cancellation and death rules, all modifications rolled back.\n if (select puntos_totales from public.progreso where user_id=a)<>950 or (select puntos_totales from public.progreso where user_id=b)<>1050 then raise exception 'Premio incorrecto o duplicado';end if;\n r:=public.duelo(ta,'crear',null,50);c:=r->>'codigo';r:=public.duelo(ta,'cancelar',c);if r->>'estado'<>'cancelado' then raise exception 'No cancela';end if;insert into pruebas values('cancelar espera','sin cobrar');\n r:=public.duelo(ta,'crear',null,50);c:=r->>'codigo';r:=public.duelo(tb,'unir',c,50);r:=public.duelo(ta,'listo',c);r:=public.duelo(tb,'listo',c);\n update public.duelos set inicio=clock_timestamp()-interval '5 seconds',actividad_a=clock_timestamp()-interval '5 seconds',actividad_b=clock_timestamp()-interval '5 seconds' where duelos.codigo=c;\n r:=public.duelo(ta,'morir',c,null,25);r:=public.duelo(tb,'morir',c,null,30);if r->>'ganador'<>b::text then raise exception 'No gana distancia mayor';end if;insert into pruebas values('choques simultáneos','gana distancia 30 vs 25');\n r:=public.duelo(ta,'crear',null,50);c:=r->>'codigo';r:=public.duelo(tb,'unir',c,50);r:=public.duelo(ta,'listo',c);r:=public.duelo(tb,'listo',c);\n update public.duelos set inicio=clock_timestamp()-interval '5 seconds',actividad_a=clock_timestamp()-interval '5 seconds',actividad_b=clock_timestamp()-interval '5 seconds' where duelos.codigo=c;\n r:=public.duelo(ta,'morir',c,null,25);r:=public.duelo(tb,'morir',c,null,25);if r->>'ganador' is not null or r->>'estado'<>'terminado' then raise exception 'No empata';end if;insert into pruebas values('empate exacto','devolución de ambas apuestas');\n r:=public.duelo(ta,'crear',null,50);c:=r->>'codigo';r:=public.duelo(tb,'unir',c,50);\n update public.duelos set actividad_b=clock_timestamp()-interval '11 seconds' where duelos.codigo=c;\n r:=public.duelo(ta,'reclamar',c);if r->>'ganador'<>a::text then raise exception 'Abandono incorrecto';end if;insert into pruebas values('desconexión 11 s','gana quien reclama');\n r:=public.viaje(ta,'iniciar');insert into pruebas values('viaje servidor',jsonb_array_length(r->'plan')::text||' objetos');\n begin perform public.viaje('invalido','iniciar');raise exception 'ACEPTADO';exception when others then if SQLERRM not like 'Sesión inválida%' then raise;end if;insert into pruebas values('viaje token inválido',SQLERRM);end;\n r:=public.viaje(ta,'descartar');\nend $$;\nselect * from pruebas;\nrollback;","docs/duelo-phase1.md":"# Duelo — fase 1\n\nDos pistas simultáneas. Los RPCs `duelo` y `viaje` son la única API de mutación. Los helpers no son públicos. No se emiten tokens de sesión por Realtime. Broadcast solo invalida la lectura: nunca concede victorias ni cambia saldos.\n\nAplicar la migración una sola vez, coordinada con el cliente nuevo. El endpoint antiguo guardar_progreso rechaza totales arbitrarios; clientes en caché deben recargar. `viaje` emite un plan de objetos y acredita únicamente tickets válidos, secuenciados, no repetidos y acotados por tiempo; no es un motor físico autoritativo ni una protección completa contra clientes modificados.\n\nEjecutar supabase/tests/duelo_phase1.sql: BEGIN/ROLLBACK, usa exclusivamente las cuentas existentes boba_test y jperaltar; cambios de sesiones/saldos son reversibles y no se imprimen secretos. No crea cuentas ni altera admins.\n\nPrueba manual pendiente: dos dispositivos/cuentas, apuesta 50, listos, cuenta atrás, HUD, choque único, choques cercanos y empate, corte de red >10 s, abandono, reconexión, premio/devolución únicos y saldos tras recarga. Verificar también viajes solitarios, powerups y reintento de guardado.\n"};
          for(const [name,content] of Object.entries(files)){fs.mkdirSync(path.dirname(name),{recursive:true});fs.writeFileSync(name,content);}
